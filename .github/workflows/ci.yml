name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias del sistema (TTS local de tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg

      - name: Instalar dependencias de Python
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias del sistema (TTS local del E2E)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg

      - name: Backend en venv (el E2E lo arranca)
        working-directory: backend
        run: |
          python -m venv "$HOME/venv-app"
          "$HOME/venv-app/bin/pip" install -e .

      - name: Frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build + E2E
        run: |
          export LYP_VENV_BIN="$HOME/venv-app/bin"
          npm run build
          npx playwright test
